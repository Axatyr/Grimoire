services:
  postgres:
    image: postgres:16-alpine
    container_name: grimoire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grimoire
      POSTGRES_PASSWORD: grimoire_password
      POSTGRES_DB: grimoire_db
    ports:
      - "5432:5432"
    volumes:
      - grimoire_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimoire -d grimoire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  grimoire_postgres_data:
    driver: local
